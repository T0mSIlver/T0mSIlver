name: Update README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild recent-contributions section
        # Discussions are GraphQL-only, and GraphQL always needs a token. This
        # one is scoped to this repo alone, so it cannot read my private repos.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update recent contributions"
          git push
